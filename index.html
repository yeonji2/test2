<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>사과나무 연습일지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* Layout: blueprint-style navy sheet, gold hairlines, three tree plates in a row */
  :root {
    --bg: #0d1832;
    --bg-deep: #081124;
    --panel: rgba(20, 36, 72, 0.72);
    --ink: #f3efe6;
    --muted: #a7b1c6;
    --gold: #d8b677;
    --gold-soft: rgba(216, 182, 119, 0.35);
    --gold-faint: rgba(216, 182, 119, 0.09);
    --apple: #e4473d;
    --font: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg-deep); }
  body {
    margin: 0; color: var(--ink); font-family: var(--font);
    background:
      radial-gradient(ellipse at 50% 0%, #182a52 0%, transparent 60%),
      linear-gradient(var(--gold-faint) 1px, transparent 1px) 0 0 / 80px 80px,
      linear-gradient(90deg, var(--gold-faint) 1px, transparent 1px) 0 0 / 80px 80px,
      var(--bg);
    min-height: 100vh;
  }
  main {
    max-width: 1040px; margin: 0 auto; padding-block: 28px 48px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }

  /* Hero */
  .hero { position: relative; text-align: center; padding: 36px 0 28px; overflow: hidden; }
  .hero .rings { position: absolute; left: 50%; top: 50%; width: 560px; max-width: 140%; transform: translate(-50%, -50%); pointer-events: none; }
  .hero > *:not(.rings) { position: relative; }
  .hero h1 {
    margin: 0; font-weight: 700; font-size: clamp(24px, 4.6vw, 42px); line-height: 1.3;
    letter-spacing: -0.01em; text-wrap: balance;
  }
  .hero h1 .g { color: var(--gold); }
  .rule { display: flex; align-items: center; gap: 12px; margin: 18px auto 14px; max-width: 760px; }
  .rule::before, .rule::after { content: ""; flex: 1; height: 1px; background: var(--gold-soft); }
  .rule span { width: 9px; height: 9px; border: 1px solid var(--gold); transform: rotate(45deg); }
  .hero h2 { margin: 0; font-weight: 500; font-size: clamp(18px, 3vw, 26px); }
  .hero .org { margin: 10px 0 0; font-size: clamp(14px, 2.2vw, 17px); color: var(--muted); letter-spacing: 0.04em; }
  .label {
    display: inline-block; margin-top: 22px; padding: 6px 16px; border: 1px solid var(--gold-soft);
    color: var(--gold); font-size: 15px; letter-spacing: 0.12em;
  }

  /* Info row */
  .info {
    display: flex; flex-wrap: wrap; gap: 14px 22px; justify-content: center;
    border-top: 1px solid var(--gold-soft); border-bottom: 1px solid var(--gold-soft);
    padding: 16px 0; margin: 8px 0 24px;
  }
  .info label { display: flex; align-items: center; gap: 10px; font-size: 15px; color: var(--muted); }
  .info input {
    font: inherit; font-size: 16px; color: var(--ink); background: transparent;
    border: none; border-bottom: 1px solid var(--gold-soft); padding: 6px 4px; width: 160px;
  }
  .info input:focus { outline: none; border-bottom-color: var(--gold); }
  .info input::placeholder { color: rgba(167, 177, 198, .6); }
  ::-webkit-calendar-picker-indicator { filter: invert(.8) sepia(.6); }

  /* Trees */
  .trees { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  @media (max-width: 760px) { .trees { grid-template-columns: 1fr; } }
  .tree {
    position: relative; background: var(--panel); border: 1px solid var(--gold-soft);
    padding: 18px 12px 18px; text-align: center; transition: border-color .3s, box-shadow .3s;
  }
  .tree::before, .tree::after { content: ""; position: absolute; width: 14px; height: 14px; border: 1px solid var(--gold); }
  .tree::before { top: -1px; left: -1px; border-right: 0; border-bottom: 0; }
  .tree::after { bottom: -1px; right: -1px; border-left: 0; border-top: 0; }
  .tree.done { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold), 0 0 28px rgba(216, 182, 119, .25); }
  .tree h3 { margin: 0; font-size: 20px; font-weight: 700; color: var(--gold); letter-spacing: 0.04em; }
  .tree svg { width: 100%; max-width: 280px; height: auto; display: block; margin: 4px auto 0; }
  .apple { cursor: pointer; transform-box: fill-box; transform-origin: center; transition: transform .15s; }
  .apple:hover { transform: scale(1.1); }
  .apple:focus { outline: none; }
  .apple:focus-visible .body { stroke: var(--ink); stroke-width: 3; }
  .apple .body { fill: var(--bg); stroke: var(--gold); stroke-width: 2; transition: fill .25s, stroke .25s; }
  .apple .shine { fill: rgba(255, 255, 255, 0); transition: fill .25s; }
  .apple.on .body { fill: var(--apple); stroke: #f3a59c; }
  .apple.on .shine { fill: rgba(255, 255, 255, .5); }
  .apple.pop { animation: pop .35s ease; }
  @keyframes pop { 50% { transform: scale(1.28); } }
  .count { font-size: 20px; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .count b { color: var(--apple); font-weight: 700; }
  .cheer { min-height: 24px; color: var(--gold); font-size: 15px; margin-top: 2px; }

  .total { margin-top: 24px; text-align: center; font-size: 20px; padding: 16px; border: 1px solid var(--gold-soft); background: var(--panel); }
  .total b { color: var(--apple); font-weight: 700; font-variant-numeric: tabular-nums; }

  .actions { display: flex; justify-content: center; margin-top: 18px; }
  button {
    font: inherit; font-size: 15px; color: var(--gold); background: transparent;
    border: 1px solid var(--gold); padding: 10px 22px; cursor: pointer; letter-spacing: 0.05em;
  }
  button:hover { background: var(--gold); color: var(--bg-deep); }
  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  button.ghost { color: var(--muted); border-color: var(--gold-soft); }
  button.ghost:hover { background: transparent; color: var(--ink); border-color: var(--ink); }
  .ask { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-items: center; font-size: 16px; }
  [hidden] { display: none !important; }
  .hint { text-align: center; color: var(--muted); margin-top: 12px; font-size: 14px; }
  @media (prefers-reduced-motion: reduce) { .apple, .apple .body { transition: none; } .apple.pop { animation: none; } }
</style>
</head>
<body>
<main>
  <header class="hero">
    <svg class="rings" viewBox="0 0 560 560" aria-hidden="true">
      <g fill="none" stroke="rgba(216,182,119,.18)" stroke-width="1">
        <circle cx="280" cy="280" r="270"></circle>
        <circle cx="280" cy="280" r="210"></circle>
        <circle cx="280" cy="280" r="150"></circle>
        <line x1="0" y1="280" x2="560" y2="280"></line>
        <line x1="280" y1="0" x2="280" y2="560"></line>
      </g>
    </svg>
    <h1><span class="g">수원대학교 음악 프로그램:</span> 완벽을 향한 여정</h1>
    <div class="rule" aria-hidden="true"><span></span></div>
    <h2>제27회 여름음악캠프 &amp; 음악영재아카데미</h2>
    <p class="org">수원대학교 음악테크놀로지대학</p>
    <span class="label">사과나무 연습일지</span>
  </header>

  <div class="info">
    <label for="name">이름 <input id="name" type="text" placeholder="이름을 써요"></label>
    <label for="date">날짜 <input id="date" type="date"></label>
    <label for="song">곡 이름 <input id="song" type="text" placeholder="연습한 곡"></label>
  </div>

  <section class="trees" id="trees"></section>

  <div class="total">오늘 딴 사과 <b id="total">0</b> / 15</div>

  <div class="actions">
    <button id="reset" type="button">처음부터 다시</button>
    <div id="ask" class="ask" hidden>
      <span>사과를 모두 되돌릴까요?</span>
      <button id="yes" type="button">네, 되돌려요</button>
      <button id="no" type="button" class="ghost">아니요</button>
    </div>
  </div>
  <p class="hint">한 번 연습할 때마다 사과를 눌러 빨갛게 익혀 주세요. 다시 누르면 되돌아가요.</p>
</main>

<script>
  const TREES = [
    { id: "right", name: "오른손 나무" },
    { id: "left",  name: "왼손 나무" },
    { id: "both",  name: "같이 나무" },
  ];
  const APPLE_POS = [[100, 62], [62, 100], [140, 98], [82, 140], [122, 142]];
  const CHEERS = ["", "좋아요!", "잘하고 있어요!", "절반 넘었어요!", "하나만 더!", "다 익었어요! 최고예요!"];
  const KEY = "apple-practice-log-v1";

  const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } };
  const save = (s) => { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch {} };
  let state = load();
  state.apples = state.apples || {};

  const NS = "http://www.w3.org/2000/svg";
  const el = (tag, attrs) => { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); return n; };
  const GOLD = "var(--gold)", GOLD_SOFT = "var(--gold-soft)";

  function treeSVG(tree) {
    const svg = el("svg", { viewBox: "0 0 200 240", role: "group", "aria-label": tree.name });
    const line = { fill: "none", stroke: GOLD_SOFT, "stroke-width": 1 };
    svg.append(
      el("line", { x1: 20, y1: 230, x2: 180, y2: 230, ...line }),
      el("line", { x1: 100, y1: 8, x2: 100, y2: 230, ...line, "stroke-dasharray": "3 4" }),
      el("path", { d: "M90 230 L93 160 Q100 152 107 160 L110 230", fill: "rgba(216,182,119,.10)", stroke: GOLD, "stroke-width": 1.5 }),
      el("path", { d: "M100 22 C140 22 158 50 156 72 C182 80 186 120 166 138 C162 166 132 172 118 164 C108 176 90 176 80 164 C64 172 36 164 34 138 C14 120 18 82 44 72 C42 48 62 22 100 22 Z",
        fill: "rgba(216,182,119,.08)", stroke: GOLD, "stroke-width": 1.5 }),
      el("path", { d: "M100 160 L100 120 M100 132 L78 112 M100 128 L124 108", fill: "none", stroke: GOLD_SOFT, "stroke-width": 1.2 }),
    );
    const on = state.apples[tree.id] || [false, false, false, false, false];
    state.apples[tree.id] = on;
    APPLE_POS.forEach(([x, y], i) => {
      const g = el("g", { class: "apple" + (on[i] ? " on" : ""), tabindex: 0, role: "button",
        "aria-pressed": on[i], "aria-label": `${tree.name} 사과 ${i + 1}` });
      g.append(
        el("path", { d: `M${x} ${y - 14} q2 -8 6 -10`, stroke: GOLD, "stroke-width": 2, fill: "none", "stroke-linecap": "round" }),
        el("ellipse", { cx: x + 8, cy: y - 20, rx: 6, ry: 3, fill: GOLD, transform: `rotate(-25 ${x + 8} ${y - 20})` }),
        el("circle", { class: "body", cx: x, cy: y, r: 15 }),
        el("ellipse", { class: "shine", cx: x - 5, cy: y - 5, rx: 4, ry: 6 }),
      );
      const toggle = () => {
        on[i] = !on[i];
        g.classList.toggle("on", on[i]);
        g.setAttribute("aria-pressed", on[i]);
        g.classList.remove("pop"); void g.getBBox(); g.classList.add("pop");
        save(state); update();
      };
      g.addEventListener("click", toggle);
      g.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } });
      svg.append(g);
    });
    return svg;
  }

  const wrap = document.getElementById("trees");
  function render() {
    wrap.innerHTML = "";
    TREES.forEach((t) => {
      const card = document.createElement("article");
      card.className = "tree"; card.id = "tree-" + t.id;
      card.innerHTML = `<h3>${t.name}</h3>`;
      card.append(treeSVG(t));
      card.insertAdjacentHTML("beforeend", `<div class="count"><b>0</b> / 5</div><div class="cheer"></div>`);
      wrap.append(card);
    });
    update();
  }
  function update() {
    let total = 0;
    TREES.forEach((t) => {
      const n = state.apples[t.id].filter(Boolean).length;
      total += n;
      const card = document.getElementById("tree-" + t.id);
      card.querySelector(".count b").textContent = n;
      card.querySelector(".cheer").textContent = CHEERS[n];
      card.classList.toggle("done", n === 5);
    });
    document.getElementById("total").textContent = total;
  }

  ["name", "date", "song"].forEach((k) => {
    const input = document.getElementById(k);
    input.value = state[k] || (k === "date" ? new Date().toISOString().slice(0, 10) : "");
    input.addEventListener("input", () => { state[k] = input.value; save(state); });
  });

  const resetBtn = document.getElementById("reset"), ask = document.getElementById("ask");
  resetBtn.addEventListener("click", () => { resetBtn.hidden = true; ask.hidden = false; });
  document.getElementById("no").addEventListener("click", () => { ask.hidden = true; resetBtn.hidden = false; });
  document.getElementById("yes").addEventListener("click", () => {
    TREES.forEach((t) => (state.apples[t.id] = [false, false, false, false, false]));
    save(state); render();
    ask.hidden = true; resetBtn.hidden = false;
  });

  render();
</script>
</body>
</html>
